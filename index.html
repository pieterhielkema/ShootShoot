<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>ShootShoot</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
		html, body { width: 100%; height: 100%; overflow: hidden; background: #1d1d1d; font: 14px/1.2 system-ui, sans-serif; cursor: crosshair; touch-action: none; }
		canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
		#hud { position: fixed; z-index: 2; top: 0; left: 5px; display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 0 0 5px 5px; padding: 10px; }
		#hp { width: 250px; max-width: 35vw; height: 20px; border-radius: 3px; overflow: hidden; background: red; }
		#hpFill { height: 100%; background: green; transform-origin: left; }
		#hud button { border: 0; background: none; font: inherit; cursor: pointer; }
		#dead { position: fixed; z-index: 3; inset: 0; display: none; padding: 50px; text-align: center; color: #fff; background: rgba(0, 0, 0, 0.4); cursor: pointer; }
		#dead h1 { margin-bottom: 20px; }
		#start { position: fixed; z-index: 4; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.6); cursor: default; }
		#start form { width: 100%; max-width: 320px; padding: 24px; border-radius: 8px; background: #fff; text-align: center; }
		#start h1 { margin-bottom: 16px; font-size: 24px; }
		#start input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font: inherit; font-size: 16px; user-select: text; -webkit-user-select: text; }
		#start p { min-height: 18px; margin: 6px 0; color: #c0392b; font-size: 13px; }
		#start button { padding: 10px 24px; border: 0; border-radius: 5px; font: inherit; font-weight: bold; color: #fff; background: #27ae60; cursor: pointer; }
		#start button:disabled { opacity: 0.5; cursor: default; }
		#start #cancel { margin-left: 8px; color: #333; background: #ddd; }
		#fire { position: fixed; z-index: 2; right: 20px; bottom: 20px; width: 80px; height: 80px; display: none; border: 0; border-radius: 50%; font-size: 32px; background: rgba(0, 0, 0, 0.5); }
	</style>
</head>
<body>
	<canvas id="c"></canvas>
	<div id="hud" style="display: none;">
		<div id="hp"><div id="hpFill"></div></div>
		<span>🎾 <b id="ammo">0</b></span>
		<span>👥 <b id="count">0</b></span>
		<button id="name" title="Set name">⚙️</button>
	</div>
	<div id="dead">
		<h1>You lost!</h1>
		<p>Click to play again</p>
	</div>
	<button id="fire">🎾</button>
	<div id="start">
		<form id="form" novalidate>
			<h1>ShootShoot</h1>
			<input id="nameInput" maxlength="16" placeholder="Your name" autocomplete="off" autofocus>
			<p id="error"></p>
			<button id="play" disabled>Play</button><button id="cancel" type="button" style="display: none;">Cancel</button>
		</form>
	</div>

	<script>
		'use strict';

		const INTERP_MS = 60;        // render others slightly in the past for smooth movement
		const LOOK_SEND_MS = 33;     // max rate for sending look direction
		const PLAYER_SIZE = 50;
		const SPRITE_SCALE = 2;      // sprites are cached at 2x for sharp rendering

		const $ = (id) => document.getElementById(id);
		const canvas = $('c');
		const ctx = canvas.getContext('2d', { alpha: false });

		/*
		 *  State
		 */
		let ws = null;
		let myId = 0, mapW = 2000, mapH = 2000, ballSpeed = 3000;
		let alive = false;
		let itemSprites = [];
		const meta = new Map();      // id -> { name, sprite, labelWidth }
		const items = new Map();     // id -> [type, x, y]
		let snaps = [];              // { t, players: Map(id -> [x, y, a, hp]) }
		let balls = [];              // { x, y, dx, dy, start, life }
		let timeOffset = null;       // local time - server time (lowest seen)

		let camX = 0, camY = 0;
		let angle = 0, sentAngle = null, lastLookSent = 0;
		let walking = false;
		let myName = null;           // last name we joined with
		let inGame = false;          // joined on the current connection

		/*
		 *  Canvas sizing
		 */
		let dpr = 1, vw = 0, vh = 0;
		const resize = () => {
			dpr = Math.min(window.devicePixelRatio || 1, 2);
			vw = window.innerWidth;
			vh = window.innerHeight;
			canvas.width = Math.round(vw * dpr);
			canvas.height = Math.round(vh * dpr);
		};
		window.addEventListener('resize', resize);
		resize();

		let grass = null;
		const grassImg = new Image();
		grassImg.onload = () => { grass = ctx.createPattern(grassImg, 'repeat'); };
		grassImg.src = 'assets/img/grass.jpg';

		/*
		 *  Sprite cache: drawn once per color / item type, then blitted
		 */
		const makeCanvas = (size) => {
			const c = document.createElement('canvas');
			c.width = c.height = size * SPRITE_SCALE;
			const g = c.getContext('2d');
			g.scale(SPRITE_SCALE, SPRITE_SCALE);
			return [c, g];
		};

		const roundRect = (g, x, y, w, h, r) => {
			g.beginPath();
			g.moveTo(x + r, y);
			g.arcTo(x + w, y, x + w, y + h, r);
			g.arcTo(x + w, y + h, x, y + h, r);
			g.arcTo(x, y + h, x, y, r);
			g.arcTo(x, y, x + w, y, r);
			g.closePath();
		};

		const circle = (g, x, y, r, color) => {
			g.fillStyle = color;
			g.beginPath();
			g.arc(x, y, r, 0, Math.PI * 2);
			g.fill();
		};

		const spriteCache = new Map();
		const playerSprite = (color) => {
			let sprite = spriteCache.get(color);
			if (sprite !== undefined)
				return sprite;

			const [c, g] = makeCanvas(PLAYER_SIZE);
			roundRect(g, 0, 0, PLAYER_SIZE, PLAYER_SIZE, 10);
			g.fillStyle = color;
			g.fill();
			g.clip();
			circle(g, 16, 12, 6, '#1d1d1d');
			circle(g, 34, 12, 6, '#1d1d1d');
			circle(g, 16, 10.5, 3, '#fff');
			circle(g, 34, 10.5, 3, '#fff');
			circle(g, 25, -2, 6, '#ffc6c3');
			spriteCache.set(color, c);
			return c;
		};

		const itemSprite = (emoji) => {
			const [c, g] = makeCanvas(40);
			g.font = '32px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
			g.textAlign = 'center';
			g.textBaseline = 'middle';
			g.fillText(emoji, 20, 22);
			return c;
		};

		const setMeta = (id, name, color) => {
			ctx.font = '10px system-ui, sans-serif';
			meta.set(id, { name, sprite: playerSprite(color), labelWidth: name ? ctx.measureText(name).width + 8 : 0 });
		};

		/*
		 *  HUD (DOM only touched when a value changes)
		 */
		const hud = { hp: -1, ammo: -1, count: -1 };
		const setHud = (key, value, apply) => {
			if (hud[key] !== value) {
				hud[key] = value;
				apply(value);
			}
		};
		const setDead = (dead) => {
			alive = !dead;
			$('dead').style.display = dead ? 'block' : 'none';
			$('hud').style.display = dead ? 'none' : 'flex';
			if (dead)
				setWalking(false);
		};

		/*
		 *  Networking
		 */
		const send = (msg) => {
			if (ws !== null && ws.readyState === WebSocket.OPEN)
				ws.send(JSON.stringify(msg));
		};

		const connect = () => {
			ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
			ws.onopen = () => {
				// Rejoin automatically after a reconnect
				if (myName !== null)
					send(['j', myName]);
				$('play').disabled = false;
			};
			ws.onmessage = (event) => handle(JSON.parse(event.data));
			ws.onclose = () => {
				ws = null;
				inGame = false;
				$('play').disabled = true;
				setTimeout(connect, 1000);
			};
		};

		const handle = (m) => {
			switch (m[0]) {
				case 's': return onSnapshot(m);
				case 'm':
					setHud('ammo', m[1], v => { $('ammo').textContent = v; });
					return;
				case 'd':
					return setDead(true);
				case 'e':
					showForm(inGame);
					$('error').textContent = m[1];
					$('play').disabled = false;
					return;
				case 'n':
					return joined(m[1]);
				case 'w': {
					let metaFlat, itemsFlat;
					[, myId, mapW, mapH, ballSpeed, , metaFlat, itemsFlat] = m;
					itemSprites = m[5].map(itemSprite);
					meta.clear();
					items.clear();
					snaps = [];
					balls = [];
					timeOffset = null;
					sentAngle = null;
					for (let i = 0; i < metaFlat.length; i += 3)
						setMeta(metaFlat[i], metaFlat[i + 1], metaFlat[i + 2]);
					for (let i = 0; i < itemsFlat.length; i += 4)
						items.set(itemsFlat[i], [itemsFlat[i + 1], itemsFlat[i + 2], itemsFlat[i + 3]]);

					inGame = true;
					joined(m[8]);
					setDead(false);
					return;
				}
			}
		};

		const onSnapshot = ([, t, P, B, itemsAdded, itemsRemoved, metaFlat, left]) => {
			const now = performance.now();

			// Track the smallest local - server offset seen so jitter doesn't shake the interpolation
			const offset = now - t;
			if (timeOffset === null || offset < timeOffset)
				timeOffset = offset;
			else
				timeOffset += (offset - timeOffset) * 0.002;

			for (const id of left)
				meta.delete(id);
			for (let i = 0; i < metaFlat.length; i += 3)
				setMeta(metaFlat[i], metaFlat[i + 1], metaFlat[i + 2]);
			for (let i = 0; i < itemsAdded.length; i += 4)
				items.set(itemsAdded[i], [itemsAdded[i + 1], itemsAdded[i + 2], itemsAdded[i + 3]]);
			for (const id of itemsRemoved)
				items.delete(id);
			for (let i = 0; i < B.length; i += 4) {
				const a = B[i + 2] / 100;
				balls.push({ x: B[i], y: B[i + 1], dx: Math.cos(a), dy: Math.sin(a), start: now, life: B[i + 3] / ballSpeed * 1000 });
			}

			const players = new Map();
			for (let i = 0; i < P.length; i += 5)
				players.set(P[i], [P[i + 1], P[i + 2], P[i + 3] / 100, P[i + 4]]);
			snaps.push({ t, players });
			if (snaps.length > 30)
				snaps.shift();

			setHud('count', players.size, v => { $('count').textContent = v; });
			const me = players.get(myId);
			if (me !== undefined)
				setHud('hp', me[3], v => { $('hpFill').style.transform = 'scaleX(' + Math.max(0, v) / 100 + ')'; });
		};

		/*
		 *  Interpolation
		 */
		const lerpAngle = (a, b, f) => {
			let d = b - a;
			if (d > Math.PI) d -= Math.PI * 2;
			else if (d < -Math.PI) d += Math.PI * 2;
			return a + d * f;
		};

		// Returns [[id, x, y, a, hp], ...] at server time `rt`
		const playersAt = (rt) => {
			const n = snaps.length;
			if (n === 0)
				return [];

			let i = n - 1;
			while (i > 0 && snaps[i - 1].t > rt)
				i--;
			// Drop snapshots we'll never need again
			if (i > 1) {
				snaps.splice(0, i - 1);
				i = 1;
			}

			const to = snaps[i];
			const from = i > 0 ? snaps[i - 1] : to;
			const f = to.t === from.t ? 1 : Math.max(0, Math.min(1, (rt - from.t) / (to.t - from.t)));
			const out = [];
			for (const [id, b] of to.players) {
				const a = from.players.get(id);
				if (a === undefined || f >= 1)
					out.push([id, b[0], b[1], b[2], b[3]]);
				else
					out.push([id, a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, lerpAngle(a[2], b[2], f), b[3]]);
			}
			return out;
		};

		/*
		 *  Rendering
		 */
		const frame = (now) => {
			requestAnimationFrame(frame);

			// Send look direction at a capped rate, only when it changed
			if (alive && angle !== sentAngle && now - lastLookSent > LOOK_SEND_MS) {
				sentAngle = angle;
				lastLookSent = now;
				send(['l', Math.round(angle * 100) / 100]);
			}

			const players = timeOffset === null ? [] : playersAt(now - timeOffset - INTERP_MS);
			for (const p of players) {
				if (p[0] === myId) {
					camX = p[1];
					camY = p[2];
					p[3] = angle; // own rotation is local, no lag
				}
			}

			ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
			ctx.fillStyle = '#1d1d1d';
			ctx.fillRect(0, 0, vw, vh);

			const ox = Math.round(vw / 2 - camX);
			const oy = Math.round(vh / 2 - camY);
			ctx.translate(ox, oy);

			// Visible area in map coordinates (with margin for sprites)
			const x0 = -ox - 60, y0 = -oy - 60, x1 = -ox + vw + 60, y1 = -oy + vh + 60;

			// Map, only the visible part
			const mx = Math.max(0, -ox), my = Math.max(0, -oy);
			const mw = Math.min(mapW, vw - ox) - mx, mh = Math.min(mapH, vh - oy) - my;
			if (mw > 0 && mh > 0) {
				ctx.fillStyle = grass || '#DADADA';
				ctx.fillRect(mx, my, mw, mh);
			}

			// Items
			for (const [type, x, y] of items.values()) {
				if (x > x0 && x < x1 && y > y0 && y < y1)
					ctx.drawImage(itemSprites[type], x - 20, y - 20, 40, 40);
			}

			// Balls (simulated locally from spawn events)
			ctx.fillStyle = 'orange';
			ctx.beginPath();
			let alivei = 0;
			for (const b of balls) {
				const age = now - b.start;
				if (age > b.life)
					continue;
				balls[alivei++] = b;
				const d = Math.max(0, age) / 1000 * ballSpeed;
				const x = b.x + b.dx * d, y = b.y + b.dy * d;
				ctx.moveTo(x + 5, y);
				ctx.arc(x, y, 5, 0, Math.PI * 2);
			}
			balls.length = alivei;
			ctx.fill();

			// Players
			const half = PLAYER_SIZE / 2;
			for (const [id, x, y, a] of players) {
				const m = meta.get(id);
				if (m === undefined || x < x0 || x > x1 || y < y0 || y > y1)
					continue;
				const c = Math.cos(a + Math.PI / 2), s = Math.sin(a + Math.PI / 2);
				ctx.setTransform(c * dpr, s * dpr, -s * dpr, c * dpr, (x + ox) * dpr, (y + oy) * dpr);
				ctx.drawImage(m.sprite, -half, -half, PLAYER_SIZE, PLAYER_SIZE);
			}

			// Names
			ctx.setTransform(dpr, 0, 0, dpr, ox * dpr, oy * dpr);
			ctx.font = '10px system-ui, sans-serif';
			ctx.textAlign = 'center';
			ctx.textBaseline = 'middle';
			for (const [id, x, y] of players) {
				const m = meta.get(id);
				if (m === undefined || !m.name || x < x0 || x > x1 || y < y0 || y > y1)
					continue;
				ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
				ctx.fillRect(x - m.labelWidth / 2, y + half + 10, m.labelWidth, 16);
				ctx.fillStyle = '#fff';
				ctx.fillText(m.name, x, y + half + 18);
			}
		};
		requestAnimationFrame(frame);

		/*
		 *  Input
		 */
		const setWalking = (w) => {
			if (walking !== w) {
				walking = w;
				send(['k', w ? 1 : 0]);
			}
		};
		const aim = (clientX, clientY) => {
			angle = Math.atan2(clientY - vh / 2, clientX - vw / 2);
		};
		const isWalkKey = (key) => key === 'w' || key === 'W' || key === 'ArrowUp';

		document.addEventListener('keydown', (e) => {
			if (alive && !formOpen && isWalkKey(e.key))
				setWalking(true);
		});
		document.addEventListener('keyup', (e) => {
			if (isWalkKey(e.key))
				setWalking(false);
		});
		window.addEventListener('blur', () => setWalking(false));

		canvas.addEventListener('pointermove', (e) => aim(e.clientX, e.clientY));
		canvas.addEventListener('pointerdown', (e) => {
			aim(e.clientX, e.clientY);
			if (!alive)
				return;
			if (e.pointerType === 'touch')
				setWalking(true);  // touch: hold to walk towards finger
			else if (e.button === 0)
				send(['f']);
		});
		const touchEnd = (e) => {
			if (e.pointerType === 'touch')
				setWalking(false);
		};
		canvas.addEventListener('pointerup', touchEnd);
		canvas.addEventListener('pointercancel', touchEnd);

		$('fire').addEventListener('pointerdown', (e) => {
			e.stopPropagation();
			if (alive)
				send(['f']);
		});
		if (window.matchMedia('(pointer: coarse)').matches)
			$('fire').style.display = 'block';

		/*
		 *  Name form: shown before joining, and from the ⚙️ button to rename
		 */
		let formOpen = true;
		const showForm = (rename) => {
			formOpen = true;
			setWalking(false);
			$('cancel').style.display = rename ? 'inline-block' : 'none';
			$('play').textContent = rename ? 'Save' : 'Play';
			$('error').textContent = '';
			$('start').style.display = 'flex';
			$('nameInput').focus();
		};
		const hideForm = () => {
			formOpen = false;
			$('start').style.display = 'none';
			$('nameInput').blur();
		};
		const joined = (name) => {
			myName = name;
			try { localStorage.setItem('name', name); } catch {}
			hideForm();
		};

		try { $('nameInput').value = localStorage.getItem('name') || ''; } catch {}

		$('form').addEventListener('submit', (e) => {
			e.preventDefault();
			const name = $('nameInput').value.replace(/\s+/g, ' ').trim();
			if (name === '') {
				$('error').textContent = 'Please enter a name';
				return;
			}
			if (inGame && name === myName) {
				hideForm();
				return;
			}
			$('error').textContent = '';
			$('play').disabled = true;
			send([inGame ? 'n' : 'j', name]);
			if (inGame)
				$('play').disabled = false;
		});
		$('cancel').addEventListener('click', hideForm);
		$('name').addEventListener('click', () => {
			$('nameInput').value = myName || '';
			showForm(true);
		});

		$('dead').addEventListener('click', () => {
			send(['r']);
			setDead(false);
		});

		connect();
	</script>
</body>
</html>
